[package]
name = "cargo-embassy-devtool"
version = "0.1.4"
edition = "2024"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
walkdir = "2.5.0"
toml = "1.1.4"
toml_edit = { version = "0.25.13", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
regex = "1.13.1"
anyhow = "1"
semver = "1.0.28"
log = "0.4"
simple_logger = "5.2.0"
temp-file = "0.2.0"
flate2 = "1.1.9"
crates-index = "3.14.0"
tar = "0.4"
reqwest = { version = "0.13", features = ["blocking"] }
cargo-manifest = "0.21.0"
shell-words = "1.1.1"
cargo-semver-checks = "0.49.0"
itertools = "0.15.0"
ondrop = "0.1.0"
rayon = "1.12.0"
indicatif = { version = "0.18.6" }
